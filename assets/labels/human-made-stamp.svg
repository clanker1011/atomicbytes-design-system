<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="t d">
  <title id="t">Human Made stamp</title>
  <desc id="d">Circular mid-century rubber stamp reading AtomicBytes Human Made, Set by hand.</desc>
  <rect width="240" height="240" fill="#F6F1E8"/>
  <g fill="none" stroke="#1C1915" stroke-width="3.5" stroke-linecap="round">
    <circle cx="120" cy="120" r="104"/>
    <circle cx="120" cy="120" r="96"/>
  </g>
  <defs>
    <path id="topArc" d="M 40,120 A 80,80 0 0 1 200,120"/>
    <path id="botArc" d="M 48,120 A 72,72 0 0 0 192,120"/>
  </defs>
  <text fill="#1C1915" font-family="Figtree, Source Sans 3, system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="0.22em">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">ATOMICBYTES</textPath>
  </text>
  <text fill="#1C1915" font-family="Figtree, Source Sans 3, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.18em">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">SET BY HAND</textPath>
  </text>
  <g fill="#1C1915" font-family="Fraunces, Georgia, serif" font-weight="700" text-anchor="middle">
    <text x="120" y="108" font-size="34" letter-spacing="0.04em">HUMAN</text>
    <text x="120" y="148" font-size="34" letter-spacing="0.06em">MADE</text>
  </g>
  <circle cx="120" cy="118" r="5.5" fill="#FF5B3C" stroke="#1C1915" stroke-width="2"/>
  <!-- side ticks -->
  <g stroke="#1C1915" stroke-width="2.5" stroke-linecap="round">
    <path d="M52 120 h10"/><path d="M56 112 h8"/><path d="M56 128 h8"/>
    <path d="M178 120 h10"/><path d="M176 112 h8"/><path d="M176 128 h8"/>
  </g>
</svg>
